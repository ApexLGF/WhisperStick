[platformio]
default_envs = micstick-v14
src_dir = .

[env:micstick-v14]
platform = espressif32 @ ~6.7.0
platform_packages = framework-arduinoespressif32 @ 3.20014.231204
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = dio
board_build.boot = qio
board_build.partitions = app3M_fat9M_16MB.csv
board_build.f_cpu = 240000000L
board_upload.flash_size = 16MB
board_upload.maximum_size = 3145728
monitor_speed = 115200
upload_speed = 921600
build_src_filter = +<*> -<tests/> -<bringup/> -<build/>
build_unflags = -std=gnu++11
lib_deps = bodmer/TFT_eSPI @ 2.5.43
    h2zero/NimBLE-Arduino @ 2.5.0
    adafruit/Adafruit NeoPixel @ 1.12.3
    https://github.com/Bodmer/U8g2_for_TFT_eSPI.git#a170ef8b6d8414b1ee2ecc97b5b913e08f5597ac
build_flags = -DBOARD_MICSTICK_V14
    -DHARDWARE_REVISION=14
    -DFW_VERSION_STR='"1.2.3"'
    -DCONFIG_BT_NIMBLE_HOST_TASK_STACK_SIZE=6144

    -std=gnu++17
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MSC_ON_BOOT=0
    -DARDUINO_USB_DFU_ON_BOOT=0
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_HAS_PSRAM
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=170
    -DTFT_HEIGHT=320
    -DTFT_MOSI=11
    -DTFT_SCLK=12
    -DTFT_CS=10
    -DTFT_DC=13
    -DTFT_RST=14
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DTFT_INVERSION_ON
    -DTFT_RGB_ORDER=TFT_BGR
    -DSPI_FREQUENCY=40000000
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1

[env:micstick-v14-power]
extends = env:micstick-v14
build_src_filter = -<*> +<bringup/sgm41511_test.cpp> +<charger_sgm41511.cpp>

[env:micstick-v14-power-monitor]
extends = env:micstick-v14
build_src_filter = -<*> +<bringup/sgm41511_monitor.cpp> +<charger_sgm41511.cpp>
lib_deps = bodmer/TFT_eSPI @ 2.5.43
build_flags = ${env:micstick-v14.build_flags}
    -DVBAT_ADC_MONITOR_ENABLED=1
    -DVBAT_ADC_PIN=7
    -DVBAT_DIVIDER_TOP_OHM=100000UL
    -DVBAT_DIVIDER_BOTTOM_OHM=100000UL
    -DVBAT_ADC_ENABLE_PIN=-1

[env:micstick-v14-factory]
extends = env:micstick-v14
build_src_filter = -<*> +<bringup/factory_test_v14.cpp> +<charger_sgm41511.cpp>
lib_deps = bodmer/TFT_eSPI @ 2.5.43
    h2zero/NimBLE-Arduino @ 2.5.0
    adafruit/Adafruit NeoPixel @ 1.12.3

[env:my-app-v14]
extends = env:micstick-v14
build_src_filter = -<*> +<bringup/my_app.cpp> +<charger_sgm41511.cpp>
lib_deps =
    bodmer/TFT_eSPI @ 2.5.43
    adafruit/Adafruit NeoPixel @ 1.12.3
